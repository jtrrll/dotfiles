name: CI
'on':
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  schedule:
    - cron: 0 06 * * MON
  workflow_dispatch: {}
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  NIXPKGS_ALLOW_UNFREE: 1
jobs:
  build-home-configuration:
    name: Build Home Manager configuration
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: jtrrll
            os: ubuntu-latest
          - configuration: jtrrll
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_dotnet: true
          remove_haskell: true
          remove_packages: azure-cli microsoft-edge-stable google-chrome-stable firefox postgresql* *llvm* mysql*
          testing: false
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: 'allow-import-from-derivation = false

            extra-substituters = https://devenv.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org file:///tmp/nix-binary-cache?trusted=1

            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc='
      - id: binary-cache
        name: Restore binary cache
        uses: ./.github/actions/nix-binary-cache/restore
        with:
          path: /tmp/nix-binary-cache
      - name: Build ${{ matrix.configuration }} configuration
        env:
          NIX_SHOW_STATS: 1
          NIX_SHOW_STATS_PATH: nix_eval_stats.json
        run: nix build --impure .#homeConfigurations.${{ matrix.configuration }}.activationPackage
      - name: Upload Nix evaluation statistics
        uses: actions/upload-artifact@v7
        with:
          name: nix-eval-stats-home-${{ matrix.configuration }}-${{ matrix.os }}
          path: nix_eval_stats.json
  build-nixos-configuration:
    name: Build NixOS configuration
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: athena
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_dotnet: true
          remove_haskell: true
          remove_packages: azure-cli microsoft-edge-stable google-chrome-stable firefox postgresql* *llvm* mysql*
          testing: false
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: 'allow-import-from-derivation = false

            extra-substituters = https://devenv.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org file:///tmp/nix-binary-cache?trusted=1

            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc='
      - id: binary-cache
        name: Restore binary cache
        uses: ./.github/actions/nix-binary-cache/restore
        with:
          path: /tmp/nix-binary-cache
      - name: Build ${{ matrix.configuration }} configuration
        env:
          NIX_SHOW_STATS: 1
          NIX_SHOW_STATS_PATH: nix_eval_stats.json
        run: nix build --impure .#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel
      - name: Upload Nix evaluation statistics
        uses: actions/upload-artifact@v7
        with:
          name: nix-eval-stats-nixos-${{ matrix.configuration }}
          path: nix_eval_stats.json
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: 'allow-import-from-derivation = false

            extra-substituters = https://devenv.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org file:///tmp/nix-binary-cache?trusted=1

            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc='
      - id: binary-cache
        name: Restore binary cache
        uses: ./.github/actions/nix-binary-cache/restore
        with:
          path: /tmp/nix-binary-cache
      - uses: DeterminateSystems/flake-checker-action@v14
      - name: Check flake
        env:
          NIX_SHOW_STATS: 1
          NIX_SHOW_STATS_PATH: nix_eval_stats.json
        run: 'set -o pipefail

          nix run github:Mic92/nix-fast-build -- --flake .#checks.x86_64-linux --impure --skip-cached --stream-json-lines --select ''checks: let lib = (builtins.getFlake "nixpkgs").lib; exclude = n: lib.hasPrefix "nixosConfigurations:" n || lib.hasPrefix "homeConfigurations:" n; in lib.filterAttrs (n: _: !exclude n) checks'' 2>&1 | tee nix_fast_build_results.jsonl'
      - name: Save binary cache
        if: github.ref_name == github.event.repository.default_branch
        uses: ./.github/actions/nix-binary-cache/save
        with:
          key: ${{ steps.binary-cache.outputs.key }}
          path: /tmp/nix-binary-cache
          results-file: nix_fast_build_results.jsonl
      - name: Upload Nix evaluation statistics
        uses: actions/upload-artifact@v7
        with:
          name: nix-eval-stats-check
          path: nix_eval_stats.json
